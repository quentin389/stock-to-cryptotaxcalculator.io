[tool.poetry]
name = "stock-to-cryptotaxcalculator.io"
version = "0.1.0"
description = "Parse stock data to summ.com format in order to do your stock taxes in the UK."
authors = ["Mikolaj Misiurewicz <mikolaj.misiurewicz@gmail.com>"]
license = "GPL-3.0-only"
package-mode = false

[tool.poetry.dependencies]
python = "~3.9"
pandas = "~1"
pydantic = "~1"
numpy = "~1"
pandas-stubs = "~=1.5.3"

[poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
